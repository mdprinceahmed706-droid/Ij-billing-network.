<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- Metallic 3D Cyan-Blue Gradient for 'I' -->
    <linearGradient id="gradI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Metallic 3D Amber/Gold-Cyan Gradient for 'J' -->
    <linearGradient id="gradJ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Fiber Glow Gradient -->
    <linearGradient id="fiberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows and Glow Filter -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.5" />
    </filter>

    <filter id="wifiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Metallic Border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-opacity="0.3" />

  <!-- High-Tech Optical Waves / WiFi Rings in Background -->
  <g filter="url(#wifiGlow)" opacity="0.4">
    <circle cx="256" cy="180" r="140" fill="none" stroke="#0284c7" stroke-width="4" stroke-dasharray="8 12" />
    <circle cx="256" cy="180" r="190" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="16 20" />
    <circle cx="256" cy="180" r="230" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.3" />
  </g>

  <!-- Fiber Optic Speed Arcs -->
  <path d="M 90 256 C 90 140, 422 140, 422 256" fill="none" stroke="url(#fiberGlow)" stroke-width="6" filter="url(#wifiGlow)" opacity="0.8" />

  <!-- 3D 'I' and 'J' Monogram Group -->
  <g filter="url(#shadow3d)">
    <!-- Letter 'I' Pillar -->
    <g>
      <!-- Base 3D Body -->
      <rect x="135" y="140" width="75" height="230" rx="24" fill="url(#gradI)" />
      <!-- Bevel / 3D Edge -->
      <path d="M 135 164 Q 135 140 159 140 L 186 140 Q 210 140 210 164 L 210 346 Q 210 370 186 370 L 159 370 Q 135 370 135 346 Z" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-opacity="0.7" />
      <!-- Top Gloss Reflection -->
      <rect x="142" y="146" width="61" height="95" rx="18" fill="url(#gloss)" />
      <!-- Glowing Core Line -->
      <line x1="172.5" y1="165" x2="172.5" y2="345" stroke="#bae6fd" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#wifiGlow)" />
    </g>

    <!-- Letter 'J' Dynamic Swoop -->
    <g>
      <!-- Base 3D Body for J -->
      <path d="M 270 140
               L 345 140
               L 345 285
               C 345 355, 290 385, 220 385
               C 175 385, 145 365, 135 345
               C 145 340, 160 340, 172 342
               C 190 355, 215 360, 240 355
               C 275 348, 285 320, 285 280
               L 285 140 Z" fill="url(#gradJ)" />
      
      <!-- Bevel Stroke -->
      <path d="M 270 140
               L 345 140
               L 345 285
               C 345 355, 290 385, 220 385
               C 175 385, 145 365, 135 345
               C 145 340, 160 340, 172 342
               C 190 355, 215 360, 240 355
               C 275 348, 285 320, 285 280
               L 285 140 Z" fill="none" stroke="#67e8f9" stroke-width="3" stroke-opacity="0.8" />

      <!-- Gloss highlight on J -->
      <path d="M 275 146 L 338 146 L 338 230 C 330 200, 290 190, 275 180 Z" fill="url(#gloss)" />
      <!-- Glowing Core Line on J -->
      <path d="M 315 165 L 315 280 C 315 325, 275 355, 230 355" fill="none" stroke="#cffafe" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#wifiGlow)" />
    </g>
  </g>

  <!-- WiFi Pulse Dot at top right -->
  <g transform="translate(365, 115)" filter="url(#wifiGlow)">
    <circle cx="0" cy="0" r="14" fill="#38bdf8" />
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="6 4" />
  </g>

  <!-- Subtext: NETWORK -->
  <text x="256" y="445" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" letter-spacing="10" text-anchor="middle" filter="url(#wifiGlow)">
    NETWORK
  </text>
  <text x="256" y="475" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" letter-spacing="4" text-anchor="middle" opacity="0.9">
    HIGH SPEED BROADBAND
  </text>
</svg>
